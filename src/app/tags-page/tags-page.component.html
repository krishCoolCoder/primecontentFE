<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <!-- <app-create-content-model></app-create-content-model> -->
    <div class="container">
        <div class="contentContainer d-flex justify-content-between align-items-center">
            <!-- <button 
            type="button createContent" 
            class="btn btn-primary" 
            data-bs-toggle="modal" 
            data-bs-target="#createContentModelSummon"
            (click)="redirectToCreateContent()"
            >Create content</button> -->
            <button 
            type="button createContent" 
            class="btn btn-primary" 
            (click)="redirectToCreateTagPage()"
            >Create tag</button>
            <div class="viewOptions d-flex justify-content-center align-items-center">
                <div class="gridView me-2" (click)="setGridView()">
                    <svg width="29" height="29" viewBox="0 0 29 29" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="29" height="29" rx="5" fill="#D9D9D9" class="gridViewBg" />
                        <rect x="6" y="5" width="7" height="7" rx="2" fill="#FBFBFB" />
                        <rect x="6" y="17" width="7" height="7" rx="2" fill="#FBFBFB" />
                        <rect x="16" y="5" width="7" height="7" rx="2" fill="#FBFBFB" />
                        <rect x="16" y="17" width="7" height="7" rx="2" fill="#FBFBFB" />
                    </svg>
                </div>
                <div class="listView" (click)="setListView()">
                    <svg width="29" height="29" viewBox="0 0 29 29" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="29" height="29" rx="5" fill="#D9D9D9" class="listViewBg" />
                        <rect x="6" y="5" width="17" height="7" rx="2" fill="#FBFBFB" />
                        <rect x="6" y="17" width="17" height="7" rx="2" fill="#FBFBFB" />
                    </svg>
                </div>
            </div>
            <div class="contentFilter">
                <button type="button createContent" class="btn btn-primary" (click)="openFilter()">Tag filter</button>
            </div>
        </div>
        
        <!-- List View -->
        <div class="listItemView" *ngIf="listView; else gridViewTemplate">
            <div class="d-flex justify-content-center align-items-center flex-column pt-2">
                <div class="w-50" *ngFor="let item of tags">
                    <div class="item">
                        <div class="dropdown">
                            <div class="dropdown-toggle options" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">...</div>
                            <ul class="dropdown-menu">
                                <li>
                                    <div class="dropdown-item" (click)="viewTag(item)">View</div>
                                </li>
                                <li>
                                    <div class="dropdown-item" (click)="editTag(item)">Edit</div>
                                </li>
                                <li>
                                    <div class="dropdown-item" (click)="deleteTag(item)">Delete</div>
                                </li>
                            </ul>
                        </div>
                        <p class="title">
                            {{item.tagName}}
                        </p>
                        <p class="description" *ngIf="item.description">
                            {{item.description}}
                        </p>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4" *ngIf="tags.length === 0">
                <p class="text-muted">No tags found. Create your first tag!</p>
            </div>
        </div>

        <!-- Grid View -->
        <ng-template #gridViewTemplate>
            <div class="container viewContainer">
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4">
                    <div class="col mb-3" *ngFor="let item of tags">
                        <div class="item">
                            <div class="dropdown">
                                <div class="dropdown-toggle options" type="button" data-bs-toggle="dropdown"
                                    aria-expanded="false">...</div>
                                <ul class="dropdown-menu">
                                    <li>
                                        <div class="dropdown-item" (click)="viewTag(item)">View</div>
                                    </li>
                                    <li>
                                        <div class="dropdown-item" (click)="editTag(item)">Edit</div>
                                    </li>
                                    <li>
                                        <div class="dropdown-item" (click)="deleteTag(item)">Delete</div>
                                    </li>
                                </ul>
                            </div>
                            <p class="title">
                                {{item.tagName}}
                            </p>
                            <p class="description" *ngIf="item.description">
                                {{item.description}}
                            </p>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4" *ngIf="tags.length === 0">
                    <p class="text-muted">No tags found. Create your first tag!</p>
                </div>
            </div>
        </ng-template>
    </div>
</div>

<!-- Filter Modal -->
<app-filter-modal 
    [isOpen]="isFilterOpen"
    [pageType]="'tag'"
    (closeFilter)="closeFilter()"
    (applyFilter)="onApplyFilter($event)">
</app-filter-modal>

<!-- Delete Confirmation Modal -->
<app-delete-tag-modal 
    [tagName]="selectedTag?.tagName || ''" 
    (confirmDelete)="onConfirmDelete()"
    (cancelDelete)="onCancelDelete()">
</app-delete-tag-modal>
