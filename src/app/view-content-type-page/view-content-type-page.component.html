<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="contentContainer d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <button type="button" class="btn btn-primary me-3" (click)="goBack()">
                    Back
                </button>
                <h5 class="mb-0">Content Type Details</h5>
            </div>
            <div>
                <button type="button" class="btn btn-primary" (click)="editContentType()">
                    Edit Content Type
                </button>
            </div>
        </div>
        
        <div class="container viewContainer" *ngIf="contentType">
            <div class="row">
                <div class="col-12">
                    <div class="content-details">
                        <div class="mb-4">
                            <h4 class="content-type-name">{{ contentType.contentTypeName }}</h4>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="detail-label">Content Type Name:</label>
                                <p class="detail-value">{{ contentType.contentTypeName }}</p>
                            </div>
                            <div class="col-md-6">
                                <label class="detail-label">Created At:</label>
                                <p class="detail-value">{{ contentType.createdAt | date:'medium' }}</p>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-12">
                                <label class="detail-label">Fields:</label>
                                <div class="fields-table">
                                    <table class="table">
                                        <thead>
                                            <tr>
                                                <th>Field Name</th>
                                                <th>Field Type</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let field of contentType.contentTypeList">
                                                <td>{{ field.fieldName }}</td>
                                                <td>
                                                    <span class="field-type-badge">{{ field.fieldType }}</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
