<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="content-header d-flex justify-content-between align-items-center mt-3">
            <h4>Edit Tag</h4>
            <div class="action-buttons">
                <button type="button" class="btn btn-secondary me-2" (click)="goBack()">
                    Cancel
                </button>
                <button type="button" class="btn btn-primary" (click)="saveTag()">
                    Save Changes
                </button>
            </div>
        </div>
        
        <div class="content-form mt-4" *ngIf="editedTag">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-4">Tag Details</h5>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tag Name:</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    [(ngModel)]="editedTag.tagName" 
                                    placeholder="Enter tag name">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Description:</label>
                                <textarea 
                                    class="form-control" 
                                    [(ngModel)]="editedTag.description" 
                                    placeholder="Enter tag description"
                                    rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4" *ngIf="!editedTag">
            <p class="text-muted">Tag not found.</p>
        </div>
    </div>
</div>
