<div class="filter-overlay" *ngIf="isOpen" (click)="onClose()"></div>
<div class="filter-modal" [class.open]="isOpen">
  <div class="filter-header">
    <h5>Filter</h5>
    <button type="button" class="btn-close" (click)="onClose()" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  
  <div class="filter-body">
    <div class="mb-3">
      <label for="titleFilter" class="form-label">Title Filter</label>
      <input 
        type="text" 
        class="form-control" 
        id="titleFilter" 
        [(ngModel)]="titleFilter" 
        placeholder="Enter title to filter...">
    </div>
    
    <div class="mb-4">
      <label for="fieldFilter" class="form-label">Field Filter</label>
      <input 
        type="text" 
        class="form-control" 
        id="fieldFilter" 
        [(ngModel)]="fieldFilter" 
        placeholder="Enter field to filter...">
    </div>
  </div>
  
  <div class="filter-footer">
    <button type="button" class="btn btn-secondary me-2" (click)="onClearFilter()">
      Clear
    </button>
    <button type="button" class="btn btn-primary" (click)="onApplyFilter()">
      Apply Filter
    </button>
  </div>
</div>
