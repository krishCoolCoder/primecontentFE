<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="contentContainer d-flex justify-content-between align-items-center">
            <div class="">
                <button 
                *ngIf="canCreateUser()"
                type="button createContent" 
                class="btn btn-primary me-3" 
                (click)="redirectToCreateUser()"
                >Create User</button>
            </div>
            <div class="contentFilter">
                <button type="button" class="btn btn-primary" (click)="openFilter()">User filter</button>
            </div>
        </div>
        
        <!-- List View -->
        <div class="listItemView">
            <div class="d-flex justify-content-center align-items-center flex-column pt-2">
                <div class="w-50" *ngFor="let user of users">
                    <div class="item">
                        <div class="dropdown" *ngIf="canEditUser() || canDeleteUser()">
                            <div class="dropdown-toggle options" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">...</div>
                            <ul class="dropdown-menu">
                                <li *ngIf="canEditUser()">
                                    <div class="dropdown-item" (click)="editUser(user)">Edit</div>
                                </li>
                                <li *ngIf="canDeleteUser()">
                                    <div class="dropdown-item" (click)="deleteUser(user)">Delete</div>
                                </li>
                            </ul>
                        </div>
                        <p class="title">
                            {{ user.firstName }} {{ user.lastName }}
                        </p>
                        <p class="description">
                            {{ user.email }}
                        </p>
                        <p class="role">
                            <span class="badge bg-secondary">{{ user.role }}</span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4" *ngIf="users.length === 0">
                <p class="text-muted">No users found. Create your first user!</p>
            </div>
        </div>
    </div>
</div>

<!-- Filter Modal -->
<app-filter-modal 
    [isOpen]="isFilterOpen"
    [pageType]="'user'"
    (closeFilter)="closeFilter()"
    (applyFilter)="onApplyFilter($event)">
</app-filter-modal>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteUserModalLabel">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete user "<strong>{{ selectedUser?.firstName }} {{ selectedUser?.lastName }}</strong>"?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancelDelete()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="onConfirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>
