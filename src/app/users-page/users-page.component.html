            <div class="contentFilter">
                <button type="button createContent" class="btn btn-primary">Users filter</button>
            </div>
        </div>
        <div class="container viewContainer">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4">
                <div class="col mb-3" *ngFor="let user of users">
                    <div class="item">
                        <div class="dropdown">
                            <div class="dropdown-toggle options" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">...</div>
                            <!-- <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                              Dropdown button
                            </button> -->
                            <ul class="dropdown-menu">
                                <li>
                                    <div class="dropdown-item" (click)="viewUser(user)">View</div>
                                </li>
                                <li>
                                    <div class="dropdown-item" (click)="editUser(user)">Edit</div>
                                </li>
                                <li>
                                    <div class="dropdown-item" (click)="deleteUser(user)">Delete</div>
                                </li>
                            </ul>
                        </div>
                        <p class="title">
                            {{ user.firstName }} {{ user.lastName }}
                        </p>
                        <p class="description">
                            {{ user.email }}
                        </p>
                        <p class="role">
                            <span class="badge bg-secondary">{{ user.role }}</span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4" *ngIf="users.length === 0">
                <p class="text-muted">No users found. Create your first user!</p>
            </div>
        </div>
    </div>
