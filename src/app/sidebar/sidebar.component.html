<div class="subHeaderContainer">
<ul>
    <li *ngFor="let menuItem of visibleMenuItems" 
        (click)="redirect(menuItem.key)" 
        [class.active]="activeRoute === menuItem.key">
        {{ menuItem.label }}
    </li>
</ul>
<ul class="signout">
    <li (click)="redirect('settings')" [class.active]="activeRoute === 'settings'">Settings</li>
    <li (click)="redirect('loggout')">Sign Out</li>
</ul>
</div>
