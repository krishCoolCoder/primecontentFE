<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="content-header d-flex justify-content-between align-items-center mt-3">
            <h4>View Content</h4>
            <div class="action-buttons">
                <button type="button" class="btn btn-secondary me-2" (click)="goBack()">
                    Back
                </button>
                <button type="button" class="btn btn-primary" (click)="editContent()">
                    Edit Content
                </button>
            </div>
        </div>
        
        <div class="content-details mt-4" *ngIf="content">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-4">Content Details</h5>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Content Type:</label>
                                <p class="form-control-plaintext">{{ content.contentType }}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="content-fields mt-4">
                        <h6 class="mb-3">Content Fields:</h6>
                        <div class="row" *ngFor="let field of content.contentFields">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">{{ field.fieldName }}:</label>
                                    <p class="form-control-plaintext">{{ field.fieldValue }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4" *ngIf="!content">
            <p class="text-muted">Content not found.</p>
        </div>
    </div>
</div>
