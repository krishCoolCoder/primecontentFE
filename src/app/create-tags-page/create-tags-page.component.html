<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="content-header d-flex justify-content-between align-items-center mt-3">
            <h4>Create Tag</h4>
        </div>
        
        <div class="content-form mt-4">
            <form (ngSubmit)="createTag()" #tagForm="ngForm">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Tag Details</h5>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tag Name:</label>
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        [(ngModel)]="tag.tagName" 
                                        name="tagName"
                                        placeholder="Enter tag name"
                                        required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Description:</label>
                                    <textarea 
                                        class="form-control" 
                                        [(ngModel)]="tag.description" 
                                        name="description"
                                        placeholder="Enter tag description"
                                        rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" (click)="redirectToTagList()">
                                Cancel
                            </button>
                            <button type="submit" class="btn btn-primary" [disabled]="!tagForm.valid">
                                Create Tag
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
