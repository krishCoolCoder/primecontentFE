<app-header></app-header>
<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="container">
        <form>
            <div class="mb-3 mt-2 d-flex">
                <div class="w-auto me-3">
                    <label for="contentTypeSelect" class="form-label">Content Type</label>

                    <select class="form-select w-auto" [(ngModel)]="selectedContentTypeName" name="contentTypeList"
                        (change)="contentTypeSelected($event)" id="contentTypeSelect">
                        <option [value]="'Default'">Default</option>
                        <option *ngFor="let item of contentTypeList" [value]="item.contentTypeName">
                            {{ item.contentTypeName }}
                        </option>
                    </select>
                </div>
                <div class="w-auto">
                    <label for="tagSelect" class="form-label">Tag</label>

                    <select class="form-select w-auto" [(ngModel)]="selectedTagType" name="contentTagList"
                        (change)="contentTagSelected($event)" id="tagSelect">
                        <option [value]="'Default Tag'">Default Tag</option>
                        <option *ngFor="let item of tagList" [value]="item.tagName">
                            {{ item.tagName }}
                        </option>
                    </select>
                </div>
            </div>
            <div class="" *ngIf="selectedContentTypeName != 'Default'; else defaultContent">
                <div class="mb-3" *ngFor="let item of contentFields; let i = index">
                    <label for="field_{{i}}" class="form-label">{{item.fieldName}}</label>
                    <div class="d-flex">
                        <!-- Dynamic input type based on field type -->
                        <input 
                            *ngIf="item.fieldType.toLowerCase() === 'string'"
                            [(ngModel)]="item.fieldValue" 
                            (ngModelChange)="getFieldValue({target: {value: $event}}, i)"
                            type="text" 
                            placeholder="Enter text"
                            class="form-control" 
                            id="field_{{i}}" 
                            name="field_{{i}}">
                        
                        <input 
                            *ngIf="item.fieldType.toLowerCase() === 'number' || item.fieldType.toLowerCase() === 'count'"
                            [(ngModel)]="item.fieldValue" 
                            (ngModelChange)="getFieldValue({target: {value: $event}}, i)"
                            type="number" 
                            placeholder="Enter number"
                            class="form-control" 
                            id="field_{{i}}" 
                            name="field_{{i}}">
                        
                        <select 
                            *ngIf="item.fieldType.toLowerCase() === 'boolean'"
                            [(ngModel)]="item.fieldValue" 
                            (ngModelChange)="getFieldValue({target: {value: $event}}, i)"
                            class="form-control" 
                            id="field_{{i}}" 
                            name="field_{{i}}">
                            <option value="">Select...</option>
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                        
                        <select class="form-select w-25 ms-2" disabled>
                            <option>{{item.fieldType}}</option>
                        </select>
                    </div>
                </div>
            </div>
            <ng-template class="" #defaultContent>
                <div class="mb-3">
                    <label for="contentTitle" class="form-label">Content Title</label>
                    <div class="d-flex">
                        <input type="text" placeholder="Content Title" class="form-control" id="contentTitle"
                            aria-describedby="emailHelp">
                        <select class="form-select w-25 ms-2">
                            <option>String</option>
                            <option>Number</option>
                            <option>Boolean</option>
                            <option>Count</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="contentDescription" class="form-label">Content Description</label>
                    <div class="d-flex">
                        <textarea class="form-control" id="contentDescription" rows="5"></textarea>
                        <select class="form-select w-25 ms-2 h-90">
                            <option>String</option>
                            <option>Number</option>
                            <option>Boolean</option>
                            <option>Count</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="contentComment" class="form-label">Content Comment</label>
                    <div class="d-flex">
                        <input type="text" placeholder="Content Comment" class="form-control" id="contentComment"
                            aria-describedby="emailHelp">
                        <select class="form-select w-25 ms-2">
                            <option>String</option>
                            <option>Number</option>
                            <option>Boolean</option>
                            <option>Count</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="contentLike" class="form-label">Content Like</label>
                    <div class="d-flex">
                        <input type="text" placeholder="Content Like" class="form-control" id="contentLike"
                            aria-describedby="emailHelp">
                        <select class="form-select w-25 ms-2">
                            <option>String</option>
                            <option>Number</option>
                            <option>Boolean</option>
                            <option>Count</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="contentDislike" class="form-label">Content Dislike</label>
                    <div class="d-flex">
                        <input type="text" placeholder="Content Dislike" class="form-control" id="contentDislike"
                            aria-describedby="emailHelp">
                        <select class="form-select w-25 ms-2">
                            <option>String</option>
                            <option>Number</option>
                            <option>Boolean</option>
                            <option>Count</option>
                        </select>
                    </div>
                </div>
            </ng-template>
            <button type="submit" (click)="createContent()" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>
